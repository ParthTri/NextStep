services:
    # 1. Postgres Database
    db:
        image: postgres:15-alpine
        hostname: db
        volumes:
            - ./postgres_data:/var/lib/postgresql/data
        env_file: .env
        networks:
            - network

    # 2. Redis: Standard alpine image for caching/tasks
    redis:
        image: redis:7-alpine
        hostname: redis
        env_file: .env
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        networks:
            - network

    # 3. Django: Your application
    web:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.prod.django
        container_name: django_web
        volumes:
            - .:/code
            # Prevent Docker from overwriting the container's node_modules with your host's
            # (if they differ by OS)
            - /code/.venv # <--- ADD THIS: Internal container venv
            - /code/node_modules
        ports:
            - "8000:8000"
        env_file:
            - .env
        depends_on:
            - redis
            - db
        networks:
            - network
    worker:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.worker
        volumes:
            - .:/code
        depends_on:
            - db
            - redis
        networks:
            - network

    beat:
        build:
            context: .
            dockerfile: ./docker/Dockerfile.beat
        volumes:
            - .:/code
        depends_on:
            - db
            - redis
        networks:
            - network

networks:
    network:
        driver: bridge

volumes:
    ollama_storage:
